<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<title>SiteBlitz static ad — receipt (1080x1350)</title>
<!-- Spec: docs/debate/2026-11-01-ad-campaign/02_chatgpt.md §3. Colours are the SiteBlitz site tokens so the
     ad, WhatsApp and the website look like one business. The receipt is a SAMPLE plan, never a bill. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+Gujarati:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root { --canvas:#faf9f5; --ink:#182b36; --muted:#4f5c64; --teal:#006b60; --line:rgba(24,43,54,.14); --warm:#e7b877; }
  * { box-sizing:border-box; margin:0; }
  body { width:1080px; height:1350px; background:var(--canvas); color:var(--ink);
         font-family:"Noto Sans Gujarati","Manrope",sans-serif; position:relative; overflow:hidden; }
  .abs { position:absolute; }
  .brand { left:72px; top:55px; font:800 42px/1 Manrope, sans-serif; letter-spacing:-.02em; }
  .brand b { color:var(--teal); }
  .tag { right:75px; top:66px; font:800 26px/1 Manrope,sans-serif; letter-spacing:.14em; background:var(--ink); color:var(--canvas);
         padding:12px 20px; border-radius:999px; }
  .hook { left:72px; top:150px; width:936px; font-weight:800; font-size:80px; line-height:1.15; letter-spacing:-.01em; }
  .offer { left:72px; top:262px; font-weight:700; font-size:46px; color:var(--teal); }
  .phone { left:85px; top:375px; width:405px; height:615px; border:12px solid var(--ink); border-radius:46px; overflow:hidden;
           background:#fff; box-shadow:0 40px 80px -40px rgba(24,43,54,.55); }
  .phone img { width:100%; display:block; }
  .cap { left:85px; top:1006px; width:405px; text-align:center; font-weight:700; font-size:28px; color:var(--muted); }
  .receipt { left:525px; top:385px; width:483px; height:640px; background:#fff; border:1.5px solid var(--line); border-radius:28px;
             box-shadow:0 30px 60px -36px rgba(24,43,54,.5); padding:34px 36px; }
  .receipt::before, .receipt::after { content:""; position:absolute; left:-1px; right:-1px; height:16px;
    background: radial-gradient(circle at 12px 0, var(--canvas) 9px, transparent 10px) 0 0/24px 16px repeat-x; }
  .receipt::after { bottom:-1px; transform:rotate(180deg); }
  .receipt::before { top:-1px; }
  .rh { font:800 24px/1.2 Manrope,sans-serif; letter-spacing:.14em; color:var(--muted); }
  .dash { border-top:3px dotted var(--line); margin:26px 0; }
  .lbl { font:800 24px/1 Manrope,sans-serif; letter-spacing:.16em; color:var(--muted); }
  .prod { font:800 40px/1.1 Manrope,sans-serif; margin-top:12px; }
  .price { font:800 112px/1 Manrope,sans-serif; letter-spacing:-.04em; margin-top:10px; }
  .del { font-weight:700; font-size:36px; margin-top:12px; }
  .note { font-weight:500; font-size:24px; color:var(--muted); margin-top:16px; }
  .cta { left:72px; top:1118px; width:936px; height:118px; border-radius:999px; background:var(--teal); color:#fff;
         display:flex; align-items:center; justify-content:center; gap:22px; font-weight:800; font-size:46px; }
  .cta svg { width:54px; height:54px; }
  .foot { left:72px; top:1262px; width:936px; text-align:center; font-weight:500; font-size:28px; color:var(--muted); }
</style>
</head>
<body>
  <div class="abs brand">Site<b>Blitz</b></div>
  <div class="abs tag">CONCEPT DEMO</div>
  <div class="abs hook">પહેલાં ડેમો જુઓ.</div>
  <div class="abs offer">1-પેજ વેબસાઇટ ₹7,999થી.</div>

  <div class="abs phone"><img src="assets/salon-top.png" alt=""></div>
  <div class="abs cap">કન્સેપ્ટ ડેમો • ક્લાયન્ટનું કામ નથી</div>

  <div class="abs receipt">
    <div class="rh">SAMPLE PLAN • NOT A BILL</div>
    <div class="dash"></div>
    <div class="lbl">PACKAGE</div>
    <div class="prod">LAUNCH • 1 PAGE</div>
    <div class="dash"></div>
    <div class="lbl">PRICE</div>
    <div class="price">₹7,999</div>
    <div class="note">One-time · no GST added</div>
    <div class="dash"></div>
    <div class="lbl">DELIVERY</div>
    <div class="del">લગભગ 2 કામકાજના દિવસ*</div>
  </div>

  <div class="abs cta">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.6.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.9-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
    WhatsApp પર વાત કરો
  </div>
  <div class="abs foot">*કન્ટેન્ટ અને મંજૂરી મળ્યા પછી.</div>
</body>
</html>
