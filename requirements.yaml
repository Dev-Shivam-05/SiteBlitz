packages:
  "framer-motion": "Required for scroll-reveal animations, stat counters, and page transitions"
  "three": "Core 3D library for the hero sphere"
  "@react-three/fiber": "React renderer for Three.js needed for hero section"
  "@react-three/drei": "Useful helpers and abstractions for React Three Fiber"
  "lucide-react": "Beautiful, consistent icons used throughout the design"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to merge Tailwind classes without style conflicts"

images:
  - path: "artifacts/webfactory/public/images/portfolio-1.png"
    description: "Premium dark-themed restaurant website mockup, glassmorphism, UI design presentation, high quality, appetizing food imagery"
    aspect_ratio: "16:9"
  - path: "artifacts/webfactory/public/images/portfolio-2.png"
    description: "Modern minimalist medical clinic website mockup, clean UI, blue accents, healthcare web design presentation"
    aspect_ratio: "16:9"
  - path: "artifacts/webfactory/public/images/portfolio-3.png"
    description: "High-end fashion e-commerce website mockup, dark mode, sleek typography, elegant clothing product grid UI"
    aspect_ratio: "16:9"
  - path: "artifacts/webfactory/public/images/portfolio-4.png"
    description: "Professional law firm website mockup, authoritative dark theme, golden accents, trust-building web design presentation"
    aspect_ratio: "16:9"

notes:
  - This is a static, frontend-only marketing site designed for maximum conversion.
  - Form submissions are simulated visually since no backend API is required.
  - Employs dark mode by default with electric cyan and purple accents.
